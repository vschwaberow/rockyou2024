name: Cross-Platform Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux:
    uses: ./.github/workflows/build-os.yml
    with:
      runner: ubuntu-latest
      artifact_suffix: linux

  macos:
    uses: ./.github/workflows/build-os.yml
    with:
      runner: macos-latest
      artifact_suffix: macos

  windows:
    uses: ./.github/workflows/build-os.yml
    with:
      runner: windows-latest
      artifact_suffix: windows
