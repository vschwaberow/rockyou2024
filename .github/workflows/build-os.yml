name: Build one OS

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      artifact_suffix:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ inputs.artifact_suffix }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@v4

      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.30.9"

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libssl-dev wget gnupg
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          echo "CC=clang-20" >> "$GITHUB_ENV"
          echo "CXX=clang++-20" >> "$GITHUB_ENV"

      - name: macOS packages
        if: runner.os == 'macOS'
        run: |
          brew install ninja llvm openssl@3
          echo "CMAKE_PREFIX_PATH=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Windows packages
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install ninja llvm -y --no-progress
          echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          if [ ! -f "/c/vcpkg/installed/x64-windows/lib/libcrypto.lib" ]; then
            vcpkg install openssl:x64-windows
          fi
          echo "CMAKE_PREFIX_PATH=C:/vcpkg/installed/x64-windows" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          extra=()
          extra+=(-DMZ_BZIP2=OFF)
          if [ -n "${CMAKE_PREFIX_PATH:-}" ]; then
            extra+=(-DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH")
          fi
          if [ -n "${OPENSSL_ROOT_DIR:-}" ]; then
            extra+=(-DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR")
          fi
          if [ "${RUNNER_OS}" = "Linux" ]; then
            extra+=(-DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20)
          elif [ "${RUNNER_OS}" = "macOS" ]; then
            llvm="$(brew --prefix llvm)"
            extra+=(-DCMAKE_C_COMPILER="${llvm}/bin/clang"
                    -DCMAKE_CXX_COMPILER="${llvm}/bin/clang++"
                    -DROCKYOU_USE_HOMEBREW_LLVM=ON)
          else
            extra+=(-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++)
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "${extra[@]}"

      - name: Build
        run: cmake --build build --target search search_tests

      - name: Test
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            shopt -s nullglob
            for src in "/c/vcpkg/installed/x64-windows/bin" "/c/Program Files/LLVM/bin"; do
              dlls=("${src}"/*.dll)
              for dir in build build/bin; do
                if [ ${#dlls[@]} -gt 0 ]; then
                  cp "${dlls[@]}" "${dir}/"
                fi
              done
            done
            shopt -u nullglob
            export PATH="/c/vcpkg/installed/x64-windows/bin:/c/Program Files/LLVM/bin:${PATH}"
          fi
          ctest --test-dir build --output-on-failure

      - name: Package
        shell: bash
        run: |
          cd build
          if [ -f bin/search.exe ]; then
            cmake -E tar cf search-package.zip --format=zip -- bin/search.exe
          else
            cmake -E tar cf search-package.zip --format=zip -- bin/search
          fi

      - name: Name artifacts
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.sha }}"
          fi
          SUFFIX="${{ inputs.artifact_suffix }}"
          ZIP_SRC="build/search-package.zip"
          if [ -z "$ZIP_SRC" ]; then
            echo "No CPack zip found" >&2
            exit 1
          fi
          ZIP_DST="search-${SUFFIX}-${TAG}.zip"
          cp "$ZIP_SRC" "$ZIP_DST"

          if [ -f build/bin/search.exe ]; then
            BIN_SRC="build/bin/search.exe"
            BIN_DST="search-${SUFFIX}.exe"
          elif [ -f build/bin/search ]; then
            BIN_SRC="build/bin/search"
            BIN_DST="search-${SUFFIX}"
          else
            echo "No search executable in build/bin" >&2
            ls -la build/bin || true
            exit 1
          fi
          cp "$BIN_SRC" "$BIN_DST"
          echo "zip=$ZIP_DST" >> "$GITHUB_OUTPUT"
          echo "bin=$BIN_DST" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: search-${{ inputs.artifact_suffix }}-${{ github.sha }}
          path: |
            ${{ steps.assets.outputs.zip }}
            ${{ steps.assets.outputs.bin }}
          if-no-files-found: error

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.assets.outputs.zip }}" \
            "${{ steps.assets.outputs.bin }}" \
            --repo "${{ github.repository }}" \
            --clobber
